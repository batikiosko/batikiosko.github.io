# TEMPLATE: install on business default branch as .github/workflows/catalog-pages.yml.
name: CES static catalog Pages
on:
  workflow_dispatch:
    inputs:
      artifact_sha:
        description: Existing full catalog-dist commit SHA (rollback reuses bytes)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate receiver and requested artifact
        id: request
        env:
          ARTIFACT_SHA: ${{ inputs.artifact_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { validateArtifactSha } from './.github/scripts/validate-catalog-pages.mjs';
          const sha = validateArtifactSha(process.env.ARTIFACT_SHA);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          path: artifact
          fetch-depth: 0
          persist-credentials: false
      - name: Verify static bytes (never execute artifact code)
        env:
          ARTIFACT_SHA: ${{ steps.request.outputs.sha }}
        run: |
          node .github/scripts/validate-catalog-pages.mjs artifact catalog-target.json "$ARTIFACT_SHA" "$GITHUB_REPOSITORY"
      - name: Archive validated Pages artifact without changing site bytes
        env:
          INPUT_PATH: artifact/site
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
